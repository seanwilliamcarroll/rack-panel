<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rack</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="grid">
    <section class="tile" id="weather">
      <h2>Weather</h2>
      <div class="big" id="wx-temp">--</div>
      <div class="sub" id="wx-desc">loading</div>
      <div class="age" id="wx-age"></div>
    </section>
    <section class="tile" id="vitals">
      <h2>Pi</h2>
      <div class="big" id="pi-temp">--</div>
      <div class="sub" id="pi-sub">loading</div>
      <div class="age" id="pi-age"></div>
    </section>
    <section class="tile" id="hosts">
      <h2>Hosts</h2>
      <ul id="host-list"></ul>
      <div class="age" id="host-age"></div>
    </section>
    <section class="tile" id="wan">
      <h2>WAN &middot; 1h</h2>
      <div class="wan-row">
        <span class="wan-label">&darr;</span>
        <span class="big" id="wan-rx">--</span>
      </div>
      <div class="wan-row">
        <span class="wan-label">&uarr;</span>
        <span class="big" id="wan-tx">--</span>
      </div>
      <svg viewBox="0 0 100 30" preserveAspectRatio="none"
           style="width:100%;height:36px;margin-top:8px">
        <polyline id="wan-rx-line" fill="none" stroke="var(--ok)"
                  stroke-width="1.5" vector-effect="non-scaling-stroke"/>
        <polyline id="wan-tx-line" fill="none" stroke="var(--warn)"
                  stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="age" id="wan-age"></div>
    </section>
    <section class="tile" id="flows">
      <h2>Traffic by host &middot; 15m</h2>
      <ul id="flow-list"></ul>
      <div class="age" id="flow-age"></div>
    </section>
  </div>
<script src="config.js"></script>
<script src="panel.js"></script>
</body>
</html>
